[package]
name = "soulmate-desktop"
version = "0.1.0"
description = "Local-first Soulmate desktop application"
authors = ["Soulmate contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "soulmate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.6"
tokio = { version = "1.53", features = ["time"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
