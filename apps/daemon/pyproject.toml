[project]
name = "soulmate-daemon"
version = "0.1.0"
description = "Local Soulmate daemon composition root"
requires-python = ">=3.12"
dependencies = [
  "soulmate-connector-sdk",
  "soulmate-core",
  "soulmate-local-notes-connector",
  "soulmate-llm-providers",
  "soulmate-mcp",
  "soulmate-storage-sqlite",
  "boto3>=1.40,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
# Local multilingual key embeddings (ADR-016). They are imported lazily, so a
# daemon installed without this extra simply keeps the lexical key ranking.
embeddings = [
  "numpy>=2.1,<3",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
]

[project.scripts]
soulmate = "soulmate_daemon.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulmate_daemon"]
