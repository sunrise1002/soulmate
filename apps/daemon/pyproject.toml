[project]
name = "soulmate-daemon"
version = "0.1.0"
description = "Local Soulmate daemon composition root"
requires-python = ">=3.12"
dependencies = [
  "soulmate-core",
  "soulmate-storage-sqlite",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
decision-twin = "soulmate_daemon.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulmate_daemon"]
