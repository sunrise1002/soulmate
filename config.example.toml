# Copy to config.toml. Relative paths resolve from the process working directory.
data_dir = "./data"

[server]
host = "127.0.0.1"
port = 7432

[network]
# Access from other devices is off until you enable it. When enabled the daemon
# keeps the loopback listener and adds a TLS listener on an explicit LAN address.
lan_enabled = false
# Leave empty to use the address of the default route. Wildcards are rejected.
lan_host = ""
lan_port = 7433
# Omit tls_dir to use DATA_DIR/tls for the generated service certificate.
# tls_dir = "./data/tls"
pairing_ttl_seconds = 300

[web]
enabled = true
# Omit client_dir to serve the web client bundled with the daemon, if present.
# client_dir = "./apps/web/dist"

[privacy]
mode = "strict_local"

[storage]
backend = "sqlite"
# Omit path to use DATA_DIR/decision-twin.db. `serve` creates and migrates it.
# path = "./data/decision-twin.db"

[vector]
backend = "sqlite_vec"

[llm]
provider = "ollama"

[llm.ollama]
base_url = "http://127.0.0.1:11434"
model = ""

[llm.openai_compatible]
base_url = "http://127.0.0.1:8000/v1"
model = ""
# Set SOULMATE_LLM__OPENAI_COMPATIBLE__API_KEY in the environment when required.

[embedding]
provider = "local"
