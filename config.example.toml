# Copy to config.toml. Relative paths resolve from the process working directory.
data_dir = "./data"

[server]
host = "127.0.0.1"
port = 7432

[network]
# Access from other devices is off until you enable it. When enabled the daemon
# keeps the loopback listener and adds a TLS listener on an explicit LAN address.
lan_enabled = false
# Leave empty to use the address of the default route. Wildcards are rejected.
lan_host = ""
lan_port = 7433
# Omit tls_dir to use DATA_DIR/tls for the generated service certificate.
# tls_dir = "./data/tls"
pairing_ttl_seconds = 300

[web]
enabled = true
# Omit client_dir to serve the web client bundled with the daemon, if present.
# client_dir = "./apps/web/dist"

[privacy]
mode = "strict_local"

[storage]
backend = "sqlite"
# Omit path to use DATA_DIR/soulmate.db. `serve` creates and migrates it.
# path = "./data/soulmate.db"

[remote_backup]
# Local-only remains the default. Set to "s3" for R2 or another
# S3-compatible private bucket. Remote HTTPS requires privacy.mode = "hybrid".
backend = "disabled"
automatic_daily = false
interval_hours = 24
# Supply PASSPHRASE only through the process environment.

[remote_backup.s3]
region = "auto"
prefix = "soulmate"
# endpoint_url = "https://ACCOUNT_ID.r2.cloudflarestorage.com"
# bucket = "soulmate-backups"
# Supply ACCESS_KEY_ID and SECRET_ACCESS_KEY only through the environment.

[vector]
backend = "sqlite_vec"

[llm]
provider = "ollama"

[llm.ollama]
base_url = "http://127.0.0.1:11434"
model = ""

[llm.openai_compatible]
base_url = "http://127.0.0.1:8000/v1"
model = ""
# Set SOULMATE_LLM__OPENAI_COMPATIBLE__API_KEY in the environment when required.

[embedding]
# "none" keeps today's behavior and downloads nothing. "local" enables on-device
# key embeddings; the pinned model is only fetched when the owner asks for it.
provider = "none"
model_id = "bge-m3-int8"
# Release the loaded model after this many idle seconds to return its memory.
idle_release_seconds = 300

[key_aliases]
# Group equal target keys, such as ui.theme.dark_mode and ui.theme.dark, into one
# preference. Evidence keeps its original keys, so disabling this rebuilds the
# model from them.
enabled = true
# Cosine similarity at which two different keys are suggested as duplicates when
# embeddings are enabled. Suggestions always wait for your review, because
# opposite keys such as dark and light also score highly.
semantic_threshold = 0.85
