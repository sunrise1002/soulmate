name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contribution-policy:
    name: Contribution policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate branch, PR title, and commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python scripts/validate_contribution.py branch-name "$HEAD_REF"
          python scripts/validate_contribution.py pr-title "$PR_TITLE"
          python scripts/validate_contribution.py commit-range "$BASE_SHA..$HEAD_SHA"

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked workspace
        run: uv sync --locked --all-packages
      - name: Run repository hooks
        run: uv run --locked pre-commit run --all-files

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked workspace
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy
      - name: Unit and integration tests
        run: uv run --locked pytest
      - name: Build Python packages
        run: uv build --all-packages

  workspace:
    name: pnpm workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Validate client workspace lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint clients and SDK
        run: pnpm -r lint
      - name: Check client formatting
        run: pnpm -r format:check
      - name: Type check clients and SDK
        run: pnpm -r typecheck
      - name: Test clients and SDK
        run: pnpm -r test
      - name: Build web client
        run: pnpm --filter @soulmate/web build
      - name: Build desktop frontend
        run: pnpm --filter @soulmate/desktop build

  desktop-native:
    name: Desktop bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Install Rust quality components
        run: rustup component add clippy rustfmt
      - name: Install locked workspace
        run: uv sync --locked --all-packages && pnpm install --frozen-lockfile
      - name: Build web client for the sidecar
        run: pnpm --filter @soulmate/web build
      - name: Build daemon sidecar
        run: pnpm --filter @soulmate/desktop sidecar:build
      - name: Check native formatting
        run: pnpm --filter @soulmate/desktop rust:format:check
      - name: Lint native shell
        run: pnpm --filter @soulmate/desktop rust:lint
      - name: Test native shell
        run: pnpm --filter @soulmate/desktop rust:test
      - name: Build platform installer
        env:
          CI: true
        run: pnpm --filter @soulmate/desktop tauri build --bundles ${{ matrix.bundles }}
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: soulmate-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*-setup.exe
          if-no-files-found: error
