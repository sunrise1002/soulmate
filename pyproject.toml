[project]
name = "soulmate-workspace"
version = "0.0.1"
description = "Local-first personal decision model workspace"
requires-python = ">=3.12"
dependencies = ["soulmate-core", "soulmate-daemon"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/daemon", "packages/core-python"]

[tool.uv.sources]
soulmate-core = { workspace = true }
soulmate-daemon = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "E",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FLY",
  "G",
  "I",
  "ICN",
  "ISC",
  "LOG",
  "N",
  "PIE",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "TID",
  "UP",
  "W",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", # pytest uses assert to express observable expectations.
  "S104", # tests intentionally exercise rejection of non-loopback hosts.
  "S603", # subprocess tests use fixed commands and controlled arguments.
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/daemon/src", "packages/core-python/src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: checks application boundaries and local process behavior",
  "evaluation: reproducible decision-model evaluation",
]
