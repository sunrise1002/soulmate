[project]
name = "soulmate-workspace"
version = "0.1.0"
description = "Local-first personal decision model workspace"
requires-python = ">=3.12"
dependencies = [
  "soulmate-connector-sdk",
  "soulmate-core",
  "soulmate-daemon",
  "soulmate-local-notes-connector",
  "soulmate-llm-providers",
  "soulmate-mcp",
  "soulmate-storage-sqlite",
]

[dependency-groups]
dev = [
  # The desktop sidecar bundles the local embedding runtimes, so the development
  # environment installs the same extra and can exercise them (ADR-016).
  "soulmate-daemon[embeddings]",
  "boto3-stubs[s3]>=1.40,<2",
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pyinstaller>=6.22,<7",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/daemon",
  "apps/mcp",
  "packages/connector-sdk",
  "packages/connectors-local",
  "packages/core-python",
  "packages/llm-providers",
  "packages/storage-sqlite",
]

[tool.uv.sources]
soulmate-connector-sdk = { workspace = true }
soulmate-core = { workspace = true }
soulmate-daemon = { workspace = true }
soulmate-local-notes-connector = { workspace = true }
soulmate-llm-providers = { workspace = true }
soulmate-mcp = { workspace = true }
soulmate-storage-sqlite = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "E",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FLY",
  "G",
  "I",
  "ICN",
  "ISC",
  "LOG",
  "N",
  "PIE",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "TID",
  "UP",
  "W",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", # pytest uses assert to express observable expectations.
  "S104", # tests intentionally exercise rejection of non-loopback hosts.
  "S603", # subprocess tests use fixed commands and controlled arguments.
]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "apps/daemon/src",
  "apps/mcp/src",
  "packages/connector-sdk/src",
  "packages/connectors-local/src",
  "packages/core-python/src",
  "packages/llm-providers/src",
  "packages/storage-sqlite/src",
  "tests",
]

[[tool.mypy.overrides]]
# Optional native runtimes for local embeddings; they are imported lazily and are
# absent unless the owner enables the model, so they are checked only at runtime.
module = ["numpy.*", "onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers -m 'not local_model'"
markers = [
  "integration: checks application boundaries and local process behavior",
  "evaluation: reproducible decision-model evaluation",
  "local_model: runs the real local embedding model; opt in with -m local_model",
]
