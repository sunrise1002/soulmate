repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Python lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Python format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Python type check
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: architecture
        name: Kernel architecture boundary
        entry: uv run --locked pytest tests/unit/test_architecture.py -q
        language: system
        pass_filenames: false
        files: '(^packages/core-python/|^tests/unit/test_architecture.py$)'
