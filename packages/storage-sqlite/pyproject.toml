[project]
name = "soulmate-storage-sqlite"
version = "0.1.0"
description = "SQLite persistence adapter for Soulmate"
requires-python = ">=3.12"
dependencies = [
  "soulmate-connector-sdk",
  "soulmate-core",
  "alembic>=1.15,<2",
  "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulmate_storage_sqlite"]
