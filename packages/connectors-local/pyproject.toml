[project]
name = "soulmate-local-notes-connector"
version = "0.1.0"
description = "Local text and Markdown notes connector for Soulmate"
requires-python = ">=3.12"
dependencies = ["soulmate-connector-sdk"]

[project.entry-points."soulmate.connectors"]
local-notes = "soulmate_connector_local:LocalNotesConnector"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulmate_connector_local"]
