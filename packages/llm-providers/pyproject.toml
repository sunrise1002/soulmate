[project]
name = "soulmate-llm-providers"
version = "0.1.0"
description = "Replaceable LLM provider adapters for Soulmate"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulmate_llm_providers"]
